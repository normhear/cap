<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0891b2">
<title>Cap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --day: #0891b2;
  --day2: #22d3ee;
  --bg: #f7f5f2;
  --card: #ffffff;
  --ink: #1c1b1a;
  --muted: #6b6762;
  --line: #e6e2dc;
  --font-title: "Fraunces", Georgia, "Times New Roman", serif;
  --font-text: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141312;
    --card: #1f1e1c;
    --ink: #f2efea;
    --muted: #a19c95;
    --line: #34312e;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  line-height: 1.5;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(150px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, textarea { font: inherit; font-size: 16px; color: inherit; }
svg, .deco, .tick, .ico { pointer-events: none; }
:focus-visible { outline: 3px solid var(--day); outline-offset: 2px; }

/* En-tête : compte à rebours */
.top { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 14px; }
.pill {
  font-family: var(--font-title); font-weight: 700; font-size: 15px;
  padding: 5px 12px; border-radius: 99px; color: #fff;
  background: linear-gradient(135deg, var(--day), var(--day2));
}
.pill small { font-family: var(--font-text); font-weight: 500; font-size: 13px; opacity: .9; }
.dayname { font-family: var(--font-title); font-weight: 500; color: var(--muted); }

/* Grande carte d'amorce */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  min-height: calc(100vh - 190px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  border-radius: 28px; padding: 32px 24px; color: #fff; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: linear-gradient(160deg, var(--day), var(--day2));
}
.hero::before, .hero::after, .banner::after, .reward.on::after {
  content: ""; position: absolute; z-index: -1; border-radius: 50%;
  background: rgba(255,255,255,.14); pointer-events: none;
}
.hero::before { width: 260px; height: 260px; top: -90px; right: -80px; }
.hero::after { width: 180px; height: 180px; bottom: -60px; left: -50px; }
.hero-emoji { font-size: 54px; line-height: 1; }
.hero-lieu { margin: 0; font-size: 15px; font-weight: 500; opacity: .9; }
.hero-amorce { margin: 0 0 10px; font-family: var(--font-title); font-weight: 700; font-size: 28px; line-height: 1.2; max-width: 22ch; }
.go {
  width: 158px; height: 158px; border-radius: 50%; background: #fff; color: var(--day);
  font-family: var(--font-title); font-weight: 700; font-size: 44px;
  box-shadow: 0 10px 30px rgba(0,0,0,.18); animation: pulse 2.2s ease-in-out infinite;
}
.go:active { transform: scale(.96); }
.hero-contract { margin: 6px 0 0; font-size: 14px; opacity: .9; }
.hero-text { margin: 0; font-size: 17px; max-width: 26ch; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 0 0 0 rgba(255,255,255,.55); }
  50% { box-shadow: 0 10px 30px rgba(0,0,0,.18), 0 0 0 18px rgba(255,255,255,0); }
}

/* Bandeau compact après l'amorce */
.banner {
  position: relative; overflow: hidden; isolation: isolate;
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; color: #fff;
  background: linear-gradient(135deg, var(--day), var(--day2)); margin-bottom: 18px;
}
.banner::after { width: 120px; height: 120px; right: -40px; top: -50px; }
.banner-emoji { font-size: 30px; line-height: 1; }
.banner p { margin: 0; }
.banner-amorce { font-weight: 600; line-height: 1.3; }
.banner-sub { font-size: 14px; opacity: .92; }
.timer { font-family: var(--font-title); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Blocs et cases */
.block { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-bottom: 14px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.block-title { margin: 0; font-family: var(--font-title); font-weight: 700; font-size: 19px; }
.count { font-family: var(--font-title); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-bottom: 6px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--day), var(--day2)); transition: width .3s; }
.check { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 2px; min-height: 48px; }
.check + .check { border-top: 1px solid var(--line); }
.box {
  flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.tick { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check.on .box { border-color: transparent; background: linear-gradient(135deg, var(--day), var(--day2)); }
.check.on .tick { opacity: 1; }
.check.on .lbl { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--day); }
.lbl { line-height: 1.35; }
.note { color: var(--muted); font-size: 15px; text-align: center; margin: 18px 8px; }
.light .check + .check { border-top-color: rgba(255,255,255,.3); }
.light .box { border-color: rgba(255,255,255,.7); }
.light .check.on .box { background: #fff; }
.light .check.on .tick { stroke: var(--day); }
.light .check.on .lbl { color: #fff; text-decoration-color: #fff; }

/* Récompense */
.reward {
  position: relative; overflow: hidden; isolation: isolate;
  display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; margin-bottom: 14px;
  background: var(--card); border: 1px dashed var(--line);
}
.reward-emoji { font-size: 46px; line-height: 1; filter: grayscale(1); opacity: .35; }
.reward-body { flex: 1; min-width: 0; }
.reward-kicker { margin: 0 0 2px; font-size: 13px; color: var(--muted); }
.reward-text { width: 100%; border: 0; background: transparent; padding: 2px 0; font-weight: 600; border-bottom: 1px dashed transparent; }
.reward-text:focus { outline: none; border-bottom-color: currentColor; }
.reward.on { border: 0; color: #fff; background: linear-gradient(135deg, var(--day), var(--day2)); }
.reward.on::after { width: 140px; height: 140px; right: -40px; bottom: -70px; }
.reward.on .reward-emoji { filter: none; opacity: 1; animation: bounce .9s ease both; }
.reward.on .reward-kicker { color: rgba(255,255,255,.9); }
@keyframes bounce {
  0% { transform: scale(.4); } 45% { transform: scale(1.25); } 65% { transform: scale(.92); } 85% { transform: scale(1.05); } 100% { transform: scale(1); }
}

/* Déroulé */
.link { color: var(--muted); font-size: 15px; padding: 10px 4px; width: 100%; text-align: left; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: flex; gap: 14px; padding: 7px 0; }
.timeline time { flex: none; width: 52px; font-family: var(--font-title); font-weight: 700; color: var(--day); font-variant-numeric: tabular-nums; }

/* Pages RAPPORT / BOULOT / CAP */
.page-title { margin: 6px 0 2px; font-family: var(--font-title); font-weight: 700; font-size: 30px; }
.page-sub { margin: 0 0 16px; color: var(--muted); }
.hint { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
.check.next .lbl { font-weight: 600; }
.check.next .box { border-color: var(--day); }
.field {
  display: block; width: 100%; padding: 12px 14px; border-radius: 14px;
  border: 1.5px solid var(--line); background: var(--bg); resize: vertical; line-height: 1.45;
}
.field:focus { outline: none; border-color: var(--day); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 18px;
  border-radius: 99px; font-weight: 600; color: #fff; background: linear-gradient(135deg, var(--day), var(--day2));
}
.btn.ghost { color: var(--ink); background: transparent; border: 1.5px solid var(--line); }
.btn:disabled { opacity: .6; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 10px; }
.iv-form { display: grid; gap: 10px; }
.iv-title { margin: 0 0 4px; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: var(--day); border: 1px solid var(--day); vertical-align: 2px; margin-left: 4px; }
.iv-list { margin: 0; padding: 0; list-style: none; counter-reset: q; }
.iv-list li { counter-increment: q; padding: 12px 0; }
.iv-list li + li { border-top: 1px solid var(--line); }
.iv-q { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; font-weight: 600; }
.iv-q > span:first-child::before { content: counter(q) ". "; color: var(--day); font-family: var(--font-title); }
.iv-q > span:first-child { flex: 1; }
.speak { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.speak .ico { font-size: 17px; }
.counters { display: grid; gap: 12px; margin-bottom: 14px; }
.counter {
  position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2));
}
.counter-n { font-family: var(--font-title); font-weight: 700; font-size: 40px; line-height: 1; min-width: 1.4em; font-variant-numeric: tabular-nums; }
.counter-l { font-weight: 600; line-height: 1.3; }
.counter-btns { display: flex; gap: 8px; }
.counter-btns button { min-width: 48px; height: 48px; border-radius: 99px; font-weight: 700; }
.counter .plus { background: #fff; color: var(--c1); padding: 0 14px; font-size: 18px; }
.counter .minus { background: rgba(255,255,255,.18); color: #fff; font-size: 14px; }

.dayname small { font-family: var(--font-text); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip {
  min-height: 40px; padding: 8px 14px; border-radius: 99px; font-size: 14px; font-weight: 600;
  border: 1.5px solid var(--c1); color: var(--ink); background: var(--card);
}
.chip.on { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--c1), var(--c2)); }
.sets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.set { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.set .field { color: var(--ink); font-weight: 500; padding: 10px 12px; min-height: 46px; -webkit-appearance: none; appearance: none; }
.set:last-child { grid-column: 1 / -1; }
.todo-form { display: flex; gap: 10px; align-items: center; padding: 12px; }
.todo-form .field { flex: 1; min-width: 0; }
.todo-row { display: flex; align-items: center; gap: 4px; }
.todo-row + .todo-row { border-top: 1px solid var(--line); }
.todo-row .check { flex: 1; min-width: 0; }
.todo-row .lbl { overflow-wrap: anywhere; }
.del { flex: none; width: 44px; height: 44px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; }
.del .ico { font-size: 15px; }
.inline-link { font-weight: 600; color: var(--day); text-decoration: underline; padding: 4px 2px; }
.banner-body { flex: 1; min-width: 0; }
.banner-link { flex: none; color: #fff; font-size: 14px; font-weight: 600; text-decoration: underline; padding: 8px 4px; position: relative; }
/* Minuteur */
.hero-link { color: #fff; opacity: .9; font-size: 14px; text-decoration: underline; padding: 6px 10px; margin-top: -6px; }
.go.long { font-size: 34px; }
.fab {
  position: fixed; z-index: 20; right: calc(16px + env(safe-area-inset-right)); bottom: calc(84px + env(safe-area-inset-bottom));
  min-width: 52px; height: 52px; padding: 0 14px; border-radius: 99px; font-size: 20px; font-weight: 700;
  font-family: var(--font-title); font-variant-numeric: tabular-nums;
  background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.14);
}
.fab.on { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--day), var(--day2)); font-size: 17px; }
.fab.ring { animation: pulse 1.2s ease-in-out infinite; }
@media (min-width: 572px) { .fab { right: calc(50% - 270px + 16px); } }
.sheet-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); }
.sheet {
  position: fixed; z-index: 31; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 540px;
  max-height: 88vh; overflow-y: auto; background: var(--card); border-radius: 24px 24px 0 0;
  padding: 18px calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  box-shadow: 0 -10px 40px rgba(0,0,0,.2);
}
.sheet-time { margin: 4px 0 2px; text-align: center; font-family: var(--font-title); font-weight: 700; font-size: 56px; color: var(--day); font-variant-numeric: tabular-nums; }
.sheet-sub { margin: 0 0 10px; text-align: center; color: var(--muted); }
.sheet-h { margin: 14px 0 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.chip.day { --c1: var(--day); --c2: var(--day2); }
.set.free { margin-bottom: 4px; }
.sound-row { display: flex; align-items: center; gap: 8px; }
.sound-row + .sound-row { border-top: 1px solid var(--line); }
.sound-row .check { flex: 1; }
.row.center { justify-content: center; }
.btn.big { min-height: 56px; padding: 12px 28px; font-size: 17px; }
@media (prefers-reduced-motion: reduce) { .fab.ring { animation: none; } }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
label.btn { position: relative; cursor: pointer; }
label.btn:focus-within { outline: 3px solid var(--day); outline-offset: 2px; }
.msg { margin: 0 0 10px; padding: 10px 12px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); font-size: 15px; white-space: pre-line; }
.rule + .rule { border-top: 1px solid var(--line); }
.rule-head { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 52px; text-align: left; font-weight: 600; }
.chev { font-family: var(--font-title); font-size: 22px; color: var(--day); width: 24px; text-align: center; }
.rule-body { margin: 0 0 12px; padding-left: 20px; color: var(--ink); }
.rule-body li { margin: 4px 0; }
.rule-body li::marker { color: var(--day); }

/* Onglets */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  padding: 8px calc(8px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
.tabs-in { display: flex; width: 100%; max-width: 540px; gap: 4px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 14px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); min-height: 52px; }
.tab .ico { font-size: 20px; line-height: 1; }
.tab.on { color: #fff; background: linear-gradient(135deg, var(--day), var(--day2)); }

/* Erreur lisible */
.oops { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }

/* Confettis */
.confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 50; }
.confetti i { position: absolute; top: -16px; width: 8px; height: 13px; border-radius: 2px; animation: fall 1.9s cubic-bezier(.25,.6,.45,1) forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--r)); } }

@media (prefers-reduced-motion: reduce) {
  .go, .reward.on .reward-emoji { animation: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<nav id="tabs" class="tabs" aria-label="Onglets"></nav>
<div id="overlay"></div>

<script>
/*CORE-START*/
// Cœur de Cap : données, état, stockage. Aucun accès au DOM ici,
// pour que les tests puissent l'exécuter hors navigateur.
var Cap = (function () {
  'use strict';

  var STORAGE_KEY = 'cap_v1';
  var TABS = ['jour', 'rapport', 'boulot', 'todo', 'cap'];
  var TODO_MAX = 200;

  var AMORCE_SECONDS = 5 * 60;           // durée par défaut du minuteur

  var TIMER_SOUNDS = [
    { id: 'bol', label: 'Bol tibétain', ico: '🥣' },

  ];

      },
      mar: {
        name: 'Mardi', emoji: '📘', c1: '#7c3aed', c2: '#c084fc',

        bonus: [{ id: 'mar-poste', label: 'Ranger le poste de travail' }],
        reward: { emoji: '🎧', text: 'Un épisode de ta série' },
        deroule: [['=w', 'Réveil'], ['+120', 'Session', 'rapport'], ['+300', 'Déjeuner'], ['=c', 'Fermeture']]
      },
      mer: {

          { id: 'mer-a', label: 'Session A', rapport: true },
          { id: 'mer-b', label: 'Session B', rapport: true }
        ],
        bonus: [{ id: 'mer-projet', label: 'Une étape d’un projet perso' }],
        reward: { emoji: '🎨', text: 'Ton activité créative préférée' },
        deroule: [['=w', 'Réveil'], ['+90', 'Session A', 'rapport'], ['13:00', 'Déjeuner'], ['15:00', 'Session B', 'rapport'], ['=c', 'Fermeture']]
      },
      jeu: {
        name: 'Jeudi', emoji: '🌿', c1: '#15803d', c2: '#4ade80',
        lieu: 'Au bureau, puis retour',
        amorce: 'Une session avant de partir. 45 minutes.',
        amorceApres: 'Une tâche de ta to-do avant de partir.',
        essentiels: [
          { id: 'jeu-session', label: 'Une session', rapport: true },
          { id: 'jeu-etapes', label: 'Noter les 3 prochaines étapes' }
        ],
        bonus: [],

    essentialsDone: essentialsDone, rewardUnlocked: rewardUnlocked, toggleDayCheck: toggleDayCheck,
    togglePrep: togglePrep, nextPrep: nextPrep, prepDoneToday: prepDoneToday,
    amorceStatus: amorceStatus, startAmorce: startAmorce, amorceRemaining: amorceRemaining,
    finishAmorce: finishAmorce, expireAmorces: expireAmorces, bumpCounter: bumpCounter, closeWeek: closeWeek,
    toggleAnchor: toggleAnchor, setSetting: setSetting, selectDay: selectDay, LEVER_STEP: LEVER_STEP,
    TODO_MAX: TODO_MAX, addTodo: addTodo, toggleTodo: toggleTodo, removeTodo: removeTodo,
    restoreTodo: restoreTodo, sortedTodos: sortedTodos,
    setRapportRendu: setRapportRendu, unsetRapportRendu: unsetRapportRendu,
    isRendu: isRendu, todoSlots: todoSlots, syncTodoPicks: syncTodoPicks, dayEssentials: dayEssentials,
    dayBonus: dayBonus, dayAmorce: dayAmorce, visibleTabs: visibleTabs, currentTab: currentTab,
    toggleRapport: function (state, id) { toggleIn(state.rapport, ids(RAPPORT), id); return state; },
    toggleJob: function (state, id) { toggleIn(state.jobs, ids(JOBS), id); return state; },
    interviewFor: interviewFor, interviewText: interviewText
  };
})();
/*CORE-END*/
</script>

<script>
/*VIEWS-START*/
// Vues : fonctions pures (état → HTML), sans DOM, testables hors navigateur.
// ctx = { today: Date, now: millisecondes, ui: { deroule: bool } }
(function (Cap) {
  'use strict';

  var TAB_META = {
    jour: { ico: '☀️', label: 'JOUR' },
    rapport: { ico: '📄', label: 'RAPPORT' },
    boulot: { ico: '🎯', label: 'BOULOT' },
    todo: { ico: '✅', label: 'TO-DO' },
    cap: { ico: '🧭', label: 'CAP' }
  };
  var TICK = '<svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function check(act, id, label, on) {
    return '<button type="button" class="check' + (on ? ' on' : '') + '" role="checkbox" aria-checked="' + on +
      '" data-act="' + act + '" data-id="' + esc(id) + '"><span class="box">' + TICK +
      '</span><span class="lbl">' + esc(label) + '</span></button>';
  }
  function bar(done, total) {
    var pct = total ? Math.round(done / total * 100) : 0;
    return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="' + done +
      '"><i style="width:' + pct + '%"></i></div>';
  }
  function hero(emoji, lieu, amorce, slot, minutes) {
    var m = minutes || 5;
    return '<section class="hero">' +
      '<div class="hero-emoji" aria-hidden="true">' + esc(emoji) + '</div>' +
      (lieu ? '<p class="hero-lieu">' + esc(lieu) + '</p>' : '') +
      '<h1 class="hero-amorce">' + esc(amorce) + '</h1>' +
      '<button type="button" class="go' + (m >= 100 ? ' long' : '') + '" data-act="amorce-start" data-slot="' + slot +
      '" aria-label="Lancer ' + m + ' minutes">' + m + ':00</button>' +
      '<p class="hero-contract">Après, tu as le droit d’arrêter.</p>' +
      '<button type="button" class="hero-link" data-act="timer-open">changer la durée</button>' +
      '</section>';
  }
  function banner(state, slot, emoji, amorce, now) {
    var status = Cap.amorceStatus(state, slot, now);
    var paused = state.timer.slot === slot && state.timer.status === 'paused';
    var sub = status === 'running'
      ? '<span class="timer" data-timer="' + slot + '">' + clock(Cap.amorceRemaining(state, slot, now)) + '</span>' +
        (paused ? ' · en pause' : ' · après, tu as le droit d’arrêter')
      : 'Amorce faite ✓';
    return '<section class="banner"><span class="banner-emoji" aria-hidden="true">' + esc(emoji) + '</span>' +
      '<div><p class="banner-amorce">' + esc(amorce) + '</p><p class="banner-sub">' + sub + '</p></div></section>';
  }

  function header(state, ctx) {
    var cd = Cap.countdown(state, ctx.today);
    var j = cd.days > 0 ? 'J–' + cd.days : cd.days === 0 ? 'Jour J' : 'J+' + (-cd.days);
    var k = Cap.activeDay(state, ctx.today);
    var pill = Cap.isRendu(state) && Cap.phaseFor(state, ctx.today) === 'B'
      ? '📨 <small>rapport rendu</small>' : j + ' <small>' + esc(cd.label) + '</small>';
    return '<header class="top"><span class="pill">' + pill + '</span>' +
      '<span class="dayname">' + esc(Cap.DAYS[k].emoji) + ' ' + esc(Cap.DAYS[k].name) +
      (state.selectedDay ? ' <small>(choisi)</small>' : '') + '</span></header>';
  }

  function tabbar(state) {
    var cur = Cap.currentTab(state);
    return '<div class="tabs-in">' + Cap.visibleTabs(state).map(function (t) {
      var on = cur === t;
      return '<button type="button" class="tab' + (on ? ' on' : '') + '" data-act="tab" data-tab="' + t + '" aria-label="' + TAB_META[t].label + '"' +
        (on ? ' aria-current="page"' : '') + '><span class="ico" aria-hidden="true">' + TAB_META[t].ico +
        '</span><span>' + TAB_META[t].label + '</span></button>';
    }).join('') + '</div>';
  }

  // ----- JOUR -----

  function weekendView(state) {
    var s = state.settings, it = Cap.DAYS.we.weekend;
    return '<section class="hero light">' +
      '<div class="hero-emoji" aria-hidden="true">' + esc(Cap.DAYS.we.emoji) + '</div>' +
      '<h1 class="hero-amorce">On ne touche à rien.</h1>' +
      '<p class="hero-text">Seule chose qui tient : le lever vers ' + esc(s.lever.replace(':', 'h')) + '.</p>' +
      '<div style="width:100%;max-width:340px;margin-top:10px">' +
      check('day-check', it.id, Cap.fillHeure(it.label, s), !!state.week.we.checks[it.id]) + '</div>' +
      '</section>';
  }

  function prepView(state, ctx, k) {
    var day = Cap.DAYS[k];
    var doneTonight = Cap.prepDoneToday(state, ctx.today);
    var next = Cap.nextPrep(state);
    var total = Cap.PREP.length;
    var done = Cap.PREP.filter(function (p) { return state.prep[p.id]; }).length;
    var note = '<p class="note">' + esc(Cap.CONTENT.prepNote) + '</p>';

    if (!next && !doneTonight) {
      return '<section class="hero"><div class="hero-emoji" aria-hidden="true">✅</div>' +
        '<h1 class="hero-amorce">Préparation terminée.</h1>' +
        '<p class="hero-text">' + esc(Cap.CONTENT.prepDone) + '</p></section>' + note;
    }
    var status = Cap.amorceStatus(state, 'prep', ctx.now);
    if (status === 'idle' && !doneTonight) return hero(day.emoji, 'Ce soir, une seule chose', next.label, 'prep', state.settings.timerMinutes);

    var item = doneTonight || next;
    return (status === 'idle' ? '' : banner(state, 'prep', day.emoji, item.label, ctx.now)) +
      '<section class="block"><div class="block-head"><h2 class="block-title">Ce soir</h2>' +
      '<span class="count">' + done + '/' + total + '</span></div>' + bar(done, total) +
      check('prep-check', item.id, item.label, !!state.prep[item.id]) + '</section>' +
      (doneTonight ? '<p class="note"><strong>Fait pour ce soir. On s’arrête là.</strong></p>' : '') + note;
  }

  function rewardCard(state, k) {
    var r = Cap.DAYS[k].reward;
    if (!r) return '';
    var on = Cap.rewardUnlocked(state, k);
    return '<section class="reward' + (on ? ' on' : '') + '">' +
      '<div class="reward-emoji" aria-hidden="true">' + esc(r.emoji) + '</div>' +
      '<div class="reward-body"><p class="reward-kicker">' + (on ? 'Ce soir, c’est débloqué' : 'Ce soir, quand les essentiels sont cochés') + '</p>' +
      '<input class="reward-text" data-act="reward-text" data-day="' + k + '" maxlength="120" value="' + esc(state.rewards[k]) +
      '" aria-label="Récompense du soir (modifiable)"></div></section>';
  }

  function dayView(state, ctx, k) {
    var day = Cap.DAYS[k], d = state.week[k];
    var amorce = Cap.dayAmorce(state, k);
    if (d.amorce === 'idle') return hero(day.emoji, day.lieu, amorce, k, state.settings.timerMinutes);

    var ess = Cap.dayEssentials(state, k);
    var bonus = Cap.dayBonus(state, k);
    var nDone = ess.filter(function (it) { return it.done; }).length;
    var missing = Cap.todoSlots(state, k) - ess.filter(function (it) { return it.todo; }).length;
    var html = banner(state, k, day.emoji, amorce, ctx.now);
    html += '<section class="block"><div class="block-head"><h2 class="block-title">Essentiels</h2>' +
      '<span class="count">' + nDone + '/' + ess.length + '</span></div>' + bar(nDone, ess.length) +
      ess.map(function (it) { return check(it.todo ? 'day-todo' : 'day-check', it.id, it.label, it.done); }).join('') +
      (missing > 0 ? '<p class="hint">Ta to-do est vide : ajoute ' + (missing > 1 ? '1 ou 2 tâches' : 'une tâche') +
        ' pour la journée. <button type="button" class="inline-link" data-act="tab" data-tab="todo">Ouvrir la to-do</button></p>' : '') +
      '</section>';
    html += rewardCard(state, k);
    if (bonus.length) {
      html += '<section class="block"><div class="block-head"><h2 class="block-title">Bonus</h2></div>' +
        bonus.map(function (it) { return check('day-check', it.id, it.label, !!d.checks[it.id]); }).join('') + '</section>';
    }
    html += '<button type="button" class="link" data-act="toggle-deroule" aria-expanded="' + !!ctx.ui.deroule + '">' +
      (ctx.ui.deroule ? '▾' : '▸') + ' Déroulé de la journée</button>';
    if (ctx.ui.deroule) {
      html += '<section class="block"><ol class="timeline">' + Cap.deroule(k, state.settings, Cap.isRendu(state)).map(function (r) {
        return '<li><time>' + esc(r.time) + '</time><span>' + esc(r.label) + '</span></li>';
      }).join('') + '</ol></section>';
    }
    return html;
  }

  function jour(state, ctx) {
    var k = Cap.activeDay(state, ctx.today);
    if (k === 'we') return weekendView(state);
    if (Cap.phaseFor(state, ctx.today) === 'A') return prepView(state, ctx, k);
    return dayView(state, ctx, k);
  }

  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  function longDate(str) {
    var d = Cap.parseDate(str);
    return d ? JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] : str;
  }

  function checklist(title, act, list, map) {
    var done = list.filter(function (it) { return map[it.id]; }).length;
    var nextId = '';
    for (var i = 0; i < list.length; i++) if (!map[list[i].id]) { nextId = list[i].id; break; }
    return '<section class="block"><div class="block-head"><h2 class="block-title">' + esc(title) + '</h2>' +
      '<span class="count">' + done + '/' + list.length + '</span></div>' + bar(done, list.length) +
      list.map(function (it) {
        var row = check(act, it.id, it.label, !!map[it.id]);
        return it.id === nextId ? row.replace('class="check', 'class="check next') : row;
      }).join('') + '</section>';
  }

  // ----- RAPPORT -----

  function interview(state, ui) {
    var iv = state.interview;
    var html = '<section class="block" id="interview"><div class="block-head"><h2 class="block-title">🎙 L’interview</h2></div>';
    if (!iv.title) {
      return html + '<p class="hint">Écris le titre d’une section de ton plan. Tu reçois 7 questions. Tu réponds en vrac, au clavier ou avec le micro du clavier.</p>' +
        '<form class="iv-form" data-act="interview-start">' +
        '<input class="field" data-act="interview-draft" name="title" maxlength="200" placeholder="Ex. : Présentation de l’entreprise" value="' + esc(ui.draft || '') + '" aria-label="Titre de la section">' +
        '<button type="submit" class="btn">Poser les 7 questions</button></form></section>';
    }
    var cat = Cap.interviewFor(iv.title);
    var label = { '': 'Copier tout', busy: '…', ok: 'Copié ✓', fail: 'Copie impossible : sélectionne le texte ci-dessous' }[ui.copyState || ''];
    html += '<p class="iv-title"><strong>' + esc(iv.title) + '</strong> <span class="tag">' + esc(cat.label) + '</span></p>' +
      '<p class="hint">Style moche autorisé. Réponds en vrac, personne ne lira ça.</p><ol class="iv-list">';
    cat.questions.forEach(function (q, i) {
      html += '<li><div class="iv-q"><span>' + esc(q) + '</span>' +
        '<button type="button" class="speak" data-act="speak" data-i="' + i + '" aria-label="Écouter la question"><span class="ico" aria-hidden="true">🔊</span></button></div>' +
        '<textarea class="field" rows="3" data-act="interview-answer" data-i="' + i + '" aria-label="Réponse ' + (i + 1) + '">' +
        esc(iv.answers[i]) + '</textarea></li>';
    });
    html += '</ol><div class="row">' +
      '<button type="button" class="btn" data-act="interview-copy"' + (ui.copyState === 'busy' ? ' disabled' : '') + '>' + esc(label) + '</button>' +
      '<button type="button" class="btn ghost" data-act="interview-reset">Nouvelle section</button></div>';
    if (ui.copyState === 'fail') {
      html += '<textarea class="field" rows="8" readonly data-act="copy-fallback" aria-label="Texte à copier">' +
        esc(Cap.interviewText(iv.title, iv.answers)) + '</textarea>';
    }
    return html + '</section>';
  }

  function rapport(state, ctx) {
    var s = state.settings;
    var n = Cap.daysUntil(s.rendu, ctx.today);
    var rendu = state.rapportRendu
      ? '<section class="banner"><span class="banner-emoji" aria-hidden="true">📨</span>' +
        '<div class="banner-body"><p class="banner-amorce">Rapport rendu 🎉</p><p class="banner-sub">Le ' + esc(longDate(state.rapportRendu)) + '. C’est fait.</p></div>' +
        '<button type="button" class="banner-link" data-act="rapport-undo">Annuler</button></section>'
      : '';
    var done = state.rapportRendu ? '' :
      '<div class="row"><button type="button" class="btn" data-act="rapport-rendu">J’ai rendu le rapport ✓</button></div>';
    return '<h1 class="page-title">📄 Rapport</h1>' + rendu +
      (state.rapportRendu ? '' : '<p class="page-sub">Rendu ' + esc(longDate(s.rendu)) + (n >= 0 ? ' · J–' + n : '') + '. Tu ne rédiges pas, tu réponds à des questions.</p>') +
      checklist('La méthode', 'rapport-check', Cap.RAPPORT, state.rapport) + done +
      interview(state, ctx.ui || {});
  }

  // ----- BOULOT -----

  function boulot(state) {
    var counters = '<div class="counters">' + Cap.COUNTERS.map(function (c) {
      return '<section class="counter" style="--c1:' + c.c1 + ';--c2:' + c.c2 + '">' +
        '<span class="counter-n">' + state.counters[c.id] + '</span>' +
        '<span class="counter-l">' + esc(c.label) + '</span>' +
        '<div class="counter-btns">' +
        '<button type="button" class="minus" data-act="counter" data-id="' + c.id + '" data-delta="-1" aria-label="Retirer 1 : ' + esc(c.label) + '">−1</button>' +
        '<button type="button" class="plus" data-act="counter" data-id="' + c.id + '" data-delta="1" aria-label="Ajouter 1 : ' + esc(c.label) + '">+1</button>' +
        '</div></section>';
    }).join('') + '</div>';
    return '<h1 class="page-title">🎯 Boulot</h1>' +
      '<p class="page-sub">' + esc(Cap.CONTENT.jobsIntro) + '</p>' +
      counters + checklist('Les outils à préparer', 'job-check', Cap.JOBS, state.jobs);
  }

  // ----- TO-DO -----

  function todoRow(t) {
    return '<div class="todo-row">' + check('todo-check', t.id, t.text, t.done) +
      '<button type="button" class="del" data-act="todo-del" data-id="' + esc(t.id) + '" aria-label="Supprimer : ' + esc(t.text) + '">' +
      '<span class="ico" aria-hidden="true">✕</span></button></div>';
  }

  function todo(state, ctx) {
    var ui = ctx.ui || {};
    var lists = Cap.sortedTodos(state);
    var html = '<h1 class="page-title">✅ To-do</h1>' +
      '<p class="page-sub">Ce que tu notes ici reste sur cet appareil.</p>' +
      '<form class="block todo-form" data-act="todo-add">' +
      '<input class="field" data-act="todo-draft" maxlength="300" placeholder="Une tâche…" value="' + esc(ui.todoDraft || '') +
      '" aria-label="Nouvelle tâche" enterkeyhint="done">' +
      '<button type="submit" class="btn">Ajouter</button></form>';
    if (ui.todoUndo) {
      html += '<p class="msg undo" role="status">Tâche supprimée. ' +
        '<button type="button" class="inline-link" data-act="todo-undo">Annuler</button></p>';
    }
    if (!lists.open.length && !lists.done.length) {
      return html + '<p class="note">Rien pour l’instant. Une tâche à la fois.</p>';
    }
    html += '<section class="block"><div class="block-head"><h2 class="block-title">À faire</h2>' +
      '<span class="count">' + lists.open.length + '</span></div>' +
      (lists.open.length ? lists.open.map(todoRow).join('') : '<p class="hint">Tout est fait.</p>') + '</section>';
    if (lists.done.length) {
      html += '<section class="block"><div class="block-head"><h2 class="block-title">Faites</h2>' +
        '<span class="count">' + lists.done.length + '</span></div>' + lists.done.map(todoRow).join('') + '</section>';
    }
    return html;
  }

  // ----- MINUTEUR (bouton flottant et panneau, visibles sur tous les onglets) -----

  function timerFab(state, ctx) {
    var t = state.timer, left = Cap.timerRemaining(state, ctx.now);
    var label = t.status === 'ringing' ? '🔔' : t.status === 'idle' ? '⏱' : '⏱ <span data-timer="fab">' + clock(left) + '</span>';
    return '<button type="button" class="fab' + (t.status === 'idle' ? '' : ' on') + (t.status === 'ringing' ? ' ring' : '') +
      '" data-act="timer-open" aria-label="Minuteur' + (t.status === 'idle' ? '' : ' : ' + clock(left) + ' restant') + '">' + label + '</button>';
  }

  function timerPanel(state, ctx) {
    var ui = ctx.ui || {}, t = state.timer, s = state.settings;
    if (!ui.timerOpen && t.status !== 'ringing') return '';
    var html = '<div class="sheet-backdrop" data-act="timer-close" aria-hidden="true"></div>' +
      '<section class="sheet" role="dialog" aria-modal="true" aria-label="Minuteur">' +
      '<div class="block-head"><h2 class="block-title">⏱ Minuteur</h2>' +
      (t.status === 'ringing' ? '' : '<button type="button" class="del" data-act="timer-close" aria-label="Fermer"><span class="ico" aria-hidden="true">✕</span></button>') +
      '</div>';

    if (t.status === 'ringing') {
      return html + '<p class="sheet-time">0:00</p><p class="sheet-sub">Temps écoulé. Tu as le droit d’arrêter.</p>' +
        '<div class="row center"><button type="button" class="btn big" data-act="timer-dismiss">Arrêter la sonnerie</button></div></section>';
    }
    if (t.status === 'running' || t.status === 'paused') {
      return html + '<p class="sheet-time" data-timer="sheet">' + clock(Cap.timerRemaining(state, ctx.now)) + '</p>' +
        '<p class="sheet-sub">' + (t.slot ? 'Amorce' : 'Minuteur') + ' de ' + Math.round(t.duration / 60) + ' min' +
        (t.status === 'paused' ? ' · en pause' : '') + '</p>' +
        '<div class="row center">' +
        (t.status === 'running'
          ? '<button type="button" class="btn" data-act="timer-pause">Pause</button>'
          : '<button type="button" class="btn" data-act="timer-resume">Reprendre</button>') +
        '<button type="button" class="btn ghost" data-act="timer-stop">Arrêter</button></div></section>';
    }

    var isPreset = Cap.TIMER_PRESETS.indexOf(s.timerMinutes) >= 0;
    var free = ui.timerFree || !isPreset;
    html += '<p class="sheet-time">' + s.timerMinutes + ':00</p>' +
      '<h3 class="sheet-h">Durée</h3><div class="chips">' +
      Cap.TIMER_PRESETS.map(function (m) {
        var on = !free && s.timerMinutes === m;
        return '<button type="button" class="chip day' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on +
          '" data-act="timer-min" data-min="' + m + '">' + m + ' min</button>';
      }).join('') +
      '<button type="button" class="chip day' + (free ? ' on' : '') + '" role="radio" aria-checked="' + free + '" data-act="timer-free-toggle">Libre</button></div>' +
      (free ? '<label class="set free"><span>Minutes (1 à 180)</span><input class="field" type="number" inputmode="numeric" min="1" max="180" step="1" data-act="timer-free" value="' +
        s.timerMinutes + '"></label>' : '') +
      '<h3 class="sheet-h">Son de fin</h3><div class="sounds">' +
      Cap.TIMER_SOUNDS.map(function (x) {
        var on = s.timerSound === x.id;
        return '<div class="sound-row">' +
          '<button type="button" class="check' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on + '" data-act="timer-sound" data-sound="' + x.id + '">' +
          '<span class="box">' + TICK + '</span><span class="lbl">' + x.ico + ' ' + esc(x.label) + '</span></button>' +
          '<button type="button" class="inline-link" data-act="timer-preview" data-sound="' + x.id + '">écouter</button></div>';
      }).join('') + '</div>' +
      '<p class="hint">Garde Cap ouvert : téléphone verrouillé, la sonnerie peut ne pas partir.</p>' +
      '<div class="row center"><button type="button" class="btn big" data-act="timer-start">Lancer ' + s.timerMinutes + ' min</button></div></section>';
    return html;
  }

  // ----- CAP -----

  function capView(state, ctx) {
    var s = state.settings;
    var k = Cap.activeDay(state, ctx.today);
    var todayKey = Cap.dayKeyForDate(ctx.today);
    var phase = Cap.phaseFor(state, ctx.today);
    var heure = function (t) { return t.replace(':', 'h'); };

    var chips = '<div class="chips" role="radiogroup" aria-label="Jour affiché">' +
      '<button type="button" class="chip' + (!state.selectedDay ? ' on' : '') + '" role="radio" aria-checked="' + !state.selectedDay +
      '" data-act="select-day" data-day="" style="--c1:' + Cap.DAYS[todayKey].c1 + ';--c2:' + Cap.DAYS[todayKey].c2 + '">Aujourd’hui</button>' +
      Cap.DAY_KEYS.map(function (d) {
        var on = state.selectedDay === d;
        return '<button type="button" class="chip' + (on ? ' on' : '') + '" role="radio" aria-checked="' + on +
          '" data-act="select-day" data-day="' + d + '" style="--c1:' + Cap.DAYS[d].c1 + ';--c2:' + Cap.DAYS[d].c2 + '">' +
          esc(Cap.DAYS[d].emoji) + ' ' + esc(Cap.DAYS[d].name.slice(0, 3)) + (d === 'we' ? '' : '.') + '</button>';
      }).join('') + '</div>';

    var a = state.week[k].anchors;
    var anchors = '<section class="block"><div class="block-head"><h2 class="block-title">Les ancres · ' + esc(Cap.DAYS[k].name) + '</h2></div>' +
      '<p class="hint">Visibles, jamais bloquantes.</p>' +
      check('anchor', 'lever', 'Lever vers ' + heure(s.lever), a.lever) +
      (k === 'we' ? '' : check('anchor', 'fermeture', 'Écrans de travail éteints à ' + heure(s.fermeture), a.fermeture)) +
      '</section>';

    function field(key, type, label, value) {
      return '<label class="set"><span>' + label + '</span><input class="field" type="' + type + '" data-act="setting" data-key="' + key +
        '" value="' + esc(value) + '"></label>';
    }
    var settings = '<section class="block"><div class="block-head"><h2 class="block-title">Réglages</h2></div>' +
      '<div class="sets">' +
      field('lever', 'time', 'Lever', s.lever) +
      field('fermeture', 'time', 'Fermeture', s.fermeture) +
      field('finStage', 'date', 'Fin de la phase A', s.finStage) +
      field('rendu', 'date', 'Échéance', s.rendu) +
      '<label class="set"><span>Phase</span><select class="field" data-act="setting" data-key="phase">' +
      [['auto', 'Automatique (' + phase + ')'], ['A', 'A : avant la bascule'], ['B', 'B : semaine type']].map(function (o) {
        return '<option value="' + o[0] + '"' + (s.phase === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></label></div>' +
      '<p class="hint">Le lever recule de ' + Cap.LEVER_STEP + ' min à chaque semaine close, jamais après ' + heure(s.leverMax) + '.</p>' +
      '</section>';

    var nextLever = Cap.timeToMinutes(s.lever) + Cap.LEVER_STEP <= Cap.timeToMinutes(s.leverMax);
    var close = '<section class="block"><div class="block-head"><h2 class="block-title">Fin de semaine</h2></div>' +
      '<p class="hint">Décoche la semaine' + (nextLever ? ', le lever recule de 30 min' : '') +
      '. Le rapport, les outils et les compteurs restent.' +
      (state.weeksClosed ? ' Semaines closes : ' + state.weeksClosed + '.' : '') + '</p>' +
      '<button type="button" class="btn" data-act="close-week">Clore la semaine</button></section>';

    var rules = '<section class="block"><div class="block-head"><h2 class="block-title">Les règles</h2></div>' +
      Cap.RULES.map(function (r) {
        var open = state.openRule === r.id;
        return '<div class="rule"><button type="button" class="rule-head" data-act="rule" data-id="' + r.id + '" aria-expanded="' + open + '">' +
          '<span>' + esc(r.title) + '</span><span class="chev" aria-hidden="true">' + (open ? '−' : '+') + '</span></button>' +
          (open ? '<ul class="rule-body">' + r.text.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '') +
          '</div>';
      }).join('') + '</section>';

    var info = ctx.contentInfo || { source: 'exemple', importedAt: '' };
    var ui = ctx.ui || {};
    var content = '<section class="block"><div class="block-head"><h2 class="block-title">Mon contenu</h2></div>' +
      '<p class="hint">' + (info.source === 'perso'
        ? 'Ton contenu' + (info.importedAt ? ', importé le ' + esc(longDate(info.importedAt)) : '') + '. Il reste dans ce navigateur.'
        : 'Contenu d’exemple. Importe ton fichier <strong>perso.json</strong> pour retrouver tes jours. Il restera dans ce navigateur, nulle part ailleurs.') +
      '</p>' + (ui.importMsg ? '<p class="msg" role="status">' + esc(ui.importMsg) + '</p>' : '') +
      '<div class="row"><label class="btn">Importer perso.json' +
      '<input type="file" class="file" accept=".json,application/json" data-act="import-file"></label>' +
      (info.source === 'perso' ? '<button type="button" class="btn ghost" data-act="content-reset">Revenir à l’exemple</button>' : '') +
      '</div></section>';

    return '<h1 class="page-title">🧭 Cap</h1>' +
      '<p class="page-sub">Le jour affiché change les couleurs et l’écran JOUR.</p>' +
      chips + anchors + settings + close +
      (state.rapportRendu ? '<section class="block"><div class="block-head"><h2 class="block-title">📨 Rapport rendu</h2></div>' +
        '<p class="hint">Le ' + esc(longDate(state.rapportRendu)) + '. L’onglet Rapport et les sessions de rapport sont masqués ; ' +
        'ta to-do remplit les journées.</p>' +
        '<button type="button" class="btn ghost" data-act="rapport-undo">Annuler : remettre le rapport</button></section>' : '') +
      content + rules;
  }

  Cap.views = {
    esc: esc, clock: clock, header: header, tabbar: tabbar, jour: jour,
    rapport: rapport,
    boulot: boulot,
    todo: todo,
    cap: capView,
    timerFab: timerFab,
    timerPanel: timerPanel
  };
})(Cap);
/*VIEWS-END*/
</script>

<script>
// Interface : un seul gestionnaire délégué sur document, jamais réattaché.
(function () {
  'use strict';
  if (typeof document === 'undefined') return;

  var root = document.getElementById('app');
  var nav = document.getElementById('tabs');
  var overlay = document.getElementById('overlay');
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  // Le contenu d'abord : l'état en dépend (identifiants des cases, réglages par défaut).
  var loaded = Cap.loadContent();
  Cap.setContent(loaded.content);
  var contentInfo = { source: loaded.source, importedAt: loaded.importedAt };
  var state = Cap.load();
  var ui = { deroule: false, draft: '', copyState: '', importMsg: '', todoDraft: '', todoUndo: null, timerOpen: false, timerFree: false };
  var copyToken = 0, importToken = 0, undoToken = 0;
  var CONFETTI_COLORS = Cap.DAY_KEYS.reduce(function (a, k) { return a.concat([Cap.DAYS[k].c1, Cap.DAYS[k].c2]); }, []);

  if (Cap.expireAmorces(state, Date.now())) Cap.save(state);

  function ctx() { var now = Date.now(); return { today: new Date(now), now: now, ui: ui, contentInfo: contentInfo }; }

  // Lecture d'un fichier avec délai maximum : le message « Lecture… » ne reste jamais affiché.
  function readFile(file, done) {
    var finished = false;
    function finish(err, text) { if (!finished) { finished = true; clearTimeout(timer); done(err, text); } }
    var timer = setTimeout(function () { finish('La lecture du fichier a pris trop de temps. Réessaie.'); }, 5000);
    if (!file) { finish('Aucun fichier choisi.'); return; }
    if (file.size > 500000) { finish('Ce fichier est trop gros pour être un contenu Cap.'); return; }
    try {
      var reader = new FileReader();
      reader.onload = function () { finish(null, String(reader.result)); };
      reader.onerror = function () { finish('Le fichier n’a pas pu être lu.'); };
      reader.readAsText(file);
    } catch (err) { finish('Le fichier n’a pas pu être lu.'); }
  }

  function importFile(file) {
    var token = ++importToken;
    ui.importMsg = 'Lecture…';
    render();
    readFile(file, function (err, text) {
      if (token !== importToken) return;     // un autre import ou une remise à zéro est passé entre-temps
      if (err) { ui.importMsg = err; render(); return; }
      var r = Cap.parseContentText(text);
      if (!r.ok) { ui.importMsg = r.error; render(); return; }
      var stored = Cap.saveContent(r.content, new Date());
      Cap.setContent(r.content);
      contentInfo = { source: 'perso', importedAt: Cap.dateToStr(new Date()) };
      // On garde l'état courant (actions faites pendant la lecture comprises) et on le remet en forme.
      Cap.applyContentSettings(state);
      state = Cap.normalize(state);
      Cap.save(state);
      ui.importMsg = 'Contenu importé ✓' +
        (stored ? '' : '\nCe navigateur refuse l’enregistrement : il faudra réimporter à la prochaine ouverture.') +
        (r.warnings.length ? '\n' + r.warnings.length + ' point(s) corrigé(s) : ' + r.warnings.slice(0, 3).join(' ') : '');
      render();
      confetti();
    });
  }

  function safe(fn, label) {
    try { return fn(); } catch (e) {
      return '<div class="oops"><strong>' + label + ' n’a pas pu s’afficher.</strong><br>' +
        'Les autres onglets fonctionnent toujours. Détail : ' + Cap.views.esc(e && e.message) + '</div>';
    }
  }

  var renderedDay = '';

  function render() {
    var y = window.scrollY;
    var c = ctx();
    renderedDay = Cap.dateToStr(c.today);
    var k = Cap.activeDay(state, c.today);
    // Une fois le rapport rendu, la journée retient ses tâches de to-do (stables même cochées).
    if (Cap.syncTodoPicks(state, k)) Cap.save(state);
    var tab = Cap.currentTab(state);
    var day = Cap.DAYS[k];
    var rs = document.documentElement.style;
    rs.setProperty('--day', day.c1);
    rs.setProperty('--day2', day.c2);
    if (themeMeta) themeMeta.setAttribute('content', day.c1);
    root.innerHTML = safe(function () { return Cap.views.header(state, c); }, 'L’en-tête') +
      safe(function () { return Cap.views[tab](state, c); }, 'Cet onglet');
    nav.innerHTML = safe(function () { return Cap.views.tabbar(state); }, 'La barre d’onglets');
    overlay.innerHTML = safe(function () { return Cap.views.timerFab(state, c) + Cap.views.timerPanel(state, c); }, 'Le minuteur');
    window.scrollTo(0, y);
  }

  function commit() { Cap.save(state); render(); }

  function confetti() {
    var layer = document.createElement('div');
    layer.className = 'confetti';
    layer.setAttribute('aria-hidden', 'true');
    for (var i = 0; i < 40; i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      p.style.animationDelay = (Math.random() * 0.25) + 's';
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function () { if (layer.parentNode) layer.parentNode.removeChild(layer); }, 2400);
  }

  // Copie avec délai maximum et repli : le bouton ne reste jamais bloqué sur « … ».
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(text, done) {
    var finished = false;
    function finish(ok) { if (!finished) { finished = true; done(ok); } }
    var timer = setTimeout(function () { finish(fallbackCopy(text)); }, 1500);
    try {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          function () { clearTimeout(timer); finish(true); },
          function () { clearTimeout(timer); finish(fallbackCopy(text)); });
      } else { clearTimeout(timer); finish(fallbackCopy(text)); }
    } catch (err) { clearTimeout(timer); finish(fallbackCopy(text)); }
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    } catch (err) { /* lecture vocale indisponible : rien à faire */ }
  }

  // ---------- Sons du minuteur : fabriqués dans la page, sans fichier ni réseau ----------
  var audio = null;
  // À appeler pendant un toucher : les navigateurs n'autorisent le son qu'après un geste.
  function unlockAudio() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
    } catch (err) { audio = null; }
    return audio;
  }
  function tone(ac, freq, start, dur, type, gain) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(start); o.stop(start + dur + 0.05);
  }
  function vibrate() {
    try { if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]); } catch (err) { /* rien */ }
  }
  function playSound(id) {
    if (id === 'vibre') { vibrate(); return; }
    var ac = unlockAudio();
    if (!ac) { vibrate(); return; }
    try {
      var t = ac.currentTime + 0.05;
      if (id === 'bol') {
        tone(ac, 220, t, 4.5, 'sine', 0.35); tone(ac, 607, t, 3, 'sine', 0.12); tone(ac, 1188, t, 1.6, 'sine', 0.05);
      } else if (id === 'carillon') {
        [1046.5, 784, 659.3].forEach(function (f, i) { tone(ac, f, t + i * 0.45, 1.8, 'triangle', 0.25); });
      } else {
        tone(ac, 880, t, 0.18, 'sine', 0.2); tone(ac, 880, t + 0.3, 0.18, 'sine', 0.2);
      }
    } catch (err) { vibrate(); }
  }
  var ringTimer = null;
  function startRinging() {
    stopRinging();
    var id = state.settings.timerSound, n = 0;
    function once() {
      playSound(id);
      if (id !== 'vibre') vibrate();
      if (++n >= 3 && ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    }
    once();
    ringTimer = setInterval(once, id === 'bol' ? 4500 : 2500);
  }
  function stopRinging() {
    if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
    try { if (navigator.vibrate) navigator.vibrate(0); } catch (err) { /* rien */ }
  }

  // Écran allumé pendant le minuteur, quand le navigateur le permet. Rien n'attend cette réponse :
  // si elle n'arrive jamais, le minuteur marche quand même.
  var wake = null, wakeToken = 0;
  function requestWake() {
    var tk = ++wakeToken;
    try {
      if (!navigator.wakeLock || document.hidden) return;
      navigator.wakeLock.request('screen').then(function (lock) {
        if (tk !== wakeToken || state.timer.status === 'idle') { lock.release(); return; }   // arrivée trop tard
        wake = lock;
      }, function () { /* refusé : tant pis */ });
    } catch (err) { /* indisponible */ }
  }
  function releaseWake() {
    wakeToken++;
    try { if (wake) wake.release(); } catch (err) { /* rien */ }
    wake = null;
  }

  function handle(e) {
    if (e.type === 'keydown') {
      if (e.key === 'Escape' && ui.timerOpen && state.timer.status !== 'ringing') { ui.timerOpen = false; render(); }
      return;
    }
    // Retour sur l'appli : on ne redessine que si la date a changé (le chrono se met à jour seul).
    if (e.type === 'visibilitychange') {
      if (!document.hidden && state.timer.status === 'running') requestWake();   // le verrou saute quand on quitte l'appli
      if (!document.hidden && Cap.dateToStr(new Date()) !== renderedDay) render();
      return;
    }
    var el = e.target && e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var act = el.getAttribute('data-act');
    var c = ctx();
    var k = Cap.activeDay(state, c.today);

    if (e.type === 'input') {
      // Saisie : on enregistre sans re-rendre, pour ne pas perdre le curseur.
      if (act === 'reward-text') {
        var d = el.getAttribute('data-day');
        if (state.rewards.hasOwnProperty(d)) { state.rewards[d] = el.value.slice(0, 120); Cap.save(state); }
      } else if (act === 'interview-draft') {
        ui.draft = el.value;
      } else if (act === 'todo-draft') {
        ui.todoDraft = el.value;
      } else if (act === 'interview-answer') {
        var i = Number(el.getAttribute('data-i'));
        if (i >= 0 && i < 7) { state.interview.answers[i] = el.value.slice(0, 5000); Cap.save(state); }
      }
      return;
    }

    if (e.type === 'change') {
      if (act === 'import-file') { importFile(el.files && el.files[0]); return; }
      if (act === 'timer-free') { Cap.setTimerMinutes(state, el.value); commit(); return; }
      if (act === 'setting') {
        // Valeur refusée : on redessine quand même pour remettre l'ancienne valeur affichée.
        Cap.setSetting(state, el.getAttribute('data-key'), el.value);
        commit();
      }
      return;
    }

    if (e.type === 'submit') {
      e.preventDefault();
      if (act === 'todo-add') {
        if (Cap.addTodo(state, ui.todoDraft, c.now)) { ui.todoDraft = ''; ui.todoUndo = null; commit(); }
        // On garde le clavier ouvert pour enchaîner les tâches.
        var f = document.querySelector('[data-act="todo-draft"]');
        if (f) f.focus();
        return;
      }
      if (act === 'interview-start') {
        var title = (ui.draft || '').trim();
        if (!title) { var f = el.querySelector('input'); if (f) f.focus(); return; }
        state.interview = { title: title.slice(0, 200), answers: ['', '', '', '', '', '', ''] };
        ui.draft = ''; ui.copyState = '';
        commit();
      }
      return;
    }
    if (e.type !== 'click' || /^(INPUT|TEXTAREA|SELECT|FORM)$/.test(el.tagName)) return;

    switch (act) {
      case 'tab':
        var t = el.getAttribute('data-tab');
        if (Cap.visibleTabs(state).indexOf(t) >= 0 && t !== Cap.currentTab(state)) { state.tab = t; Cap.save(state); render(); window.scrollTo(0, 0); }
        return;
      case 'amorce-start':
        unlockAudio();
        if (state.timer.status !== 'idle') { stopRinging(); Cap.stopTimer(state, c.now); }   // un seul minuteur à la fois
        Cap.startAmorce(state, el.getAttribute('data-slot') === 'prep' ? 'prep' : k, c.now);
        requestWake();
        commit(); window.scrollTo(0, 0);
        return;
      case 'timer-open':
        ui.timerOpen = true; render();
        return;
      case 'timer-close':
        if (state.timer.status === 'ringing') return;
        ui.timerOpen = false; ui.timerFree = false; render();
        return;
      case 'timer-min':
        Cap.setTimerMinutes(state, el.getAttribute('data-min'));
        ui.timerFree = false;
        commit();
        return;
      case 'timer-free-toggle':
        ui.timerFree = true; render();
        var fi = document.querySelector('[data-act="timer-free"]');
        if (fi) fi.focus();
        return;
      case 'timer-sound':
        Cap.setTimerSound(state, el.getAttribute('data-sound'));
        commit();
        return;
      case 'timer-preview':
        playSound(el.getAttribute('data-sound'));
        return;
      case 'timer-start':
        unlockAudio();
        if (state.timer.status !== 'idle') Cap.stopTimer(state, c.now);
        Cap.startTimer(state, c.now, '');
        requestWake();
        commit();
        return;
      case 'timer-pause':
        Cap.pauseTimer(state, c.now); releaseWake(); commit();
        return;
      case 'timer-resume':
        unlockAudio(); Cap.resumeTimer(state, c.now); requestWake(); commit();
        return;
      case 'timer-stop':
        Cap.stopTimer(state, c.now); releaseWake(); ui.timerOpen = false; commit();
        return;
      case 'timer-dismiss':
        stopRinging(); Cap.stopTimer(state, c.now); releaseWake(); ui.timerOpen = false; commit();
        return;
      case 'day-check':
        var before = k === 'we' ? !!state.week.we.checks['we-lever'] : Cap.essentialsDone(state, k);
        Cap.toggleDayCheck(state, k, el.getAttribute('data-id'));
        var after = k === 'we' ? !!state.week.we.checks['we-lever'] : Cap.essentialsDone(state, k);
        commit();
        if (!before && after) confetti();
        return;
      case 'prep-check':
        var id = el.getAttribute('data-id');
        var wasOn = !!state.prep[id];
        Cap.togglePrep(state, id, c.today);
        commit();
        if (!wasOn) confetti();
        return;
      case 'toggle-deroule':
        ui.deroule = !ui.deroule; render();
        return;
      case 'rapport-check':
        var rWas = Cap.RAPPORT.every(function (r) { return state.rapport[r.id]; });
        Cap.toggleRapport(state, el.getAttribute('data-id'));
        commit();
        if (!rWas && Cap.RAPPORT.every(function (r) { return state.rapport[r.id]; })) confetti();
        return;
      case 'job-check':
        Cap.toggleJob(state, el.getAttribute('data-id'));
        commit();
        return;
      case 'counter':
        Cap.bumpCounter(state, el.getAttribute('data-id'), Number(el.getAttribute('data-delta')) > 0 ? 1 : -1);
        commit();
        return;
      case 'speak':
        var q = Cap.interviewFor(state.interview.title).questions[Number(el.getAttribute('data-i'))];
        if (q) speak(q);
        return;
      case 'interview-copy':
        var token = ++copyToken;
        var title0 = state.interview.title;
        ui.copyState = 'busy'; render();
        copyText(Cap.interviewText(state.interview.title, state.interview.answers), function (ok) {
          // Réponse arrivée trop tard (autre copie, ou autre section) : on l'ignore.
          if (token !== copyToken || state.interview.title !== title0) return;
          ui.copyState = ok ? 'ok' : 'fail';
          render();
          if (ok) setTimeout(function () { if (token === copyToken && ui.copyState === 'ok') { ui.copyState = ''; render(); } }, 2500);
        });
        return;
      case 'select-day':
        Cap.selectDay(state, el.getAttribute('data-day'));
        commit();
        return;
      case 'anchor':
        Cap.toggleAnchor(state, k, el.getAttribute('data-id'));
        commit();
        return;
      case 'rule':
        var rid = el.getAttribute('data-id');
        state.openRule = state.openRule === rid ? '' : rid;
        commit();
        return;
      case 'close-week':
        var s0 = state.settings;
        var leverAfter = Math.min(Cap.timeToMinutes(s0.lever) + Cap.LEVER_STEP, Cap.timeToMinutes(s0.leverMax));
        var newLever = Cap.toTime(leverAfter, s0.lever).replace(':', 'h');
        if (!window.confirm('Clore la semaine ?\n\nToutes les cases de la semaine se décochent. Lever : ' + newLever +
          '.\nLe rapport, les outils et les compteurs restent.')) return;
        Cap.closeWeek(state);
        commit();
        window.scrollTo(0, 0);
        return;
      case 'content-reset':
        if (!window.confirm('Revenir au contenu d’exemple ?\n\nTon contenu importé est retiré de ce navigateur. Ton fichier perso.json n’est pas touché.')) return;
        importToken++;
        Cap.clearContent();
        Cap.setContent(Cap.normalizeContent(Cap.SAMPLE).content);
        contentInfo = { source: 'exemple', importedAt: '' };
        Cap.applyContentSettings(state);
        state = Cap.normalize(state);
        ui.importMsg = 'Contenu d’exemple rétabli.';
        commit();
        return;
      case 'todo-check':
        Cap.toggleTodo(state, el.getAttribute('data-id'), c.now);
        commit();
        return;
      case 'todo-del':
        var removed = Cap.removeTodo(state, el.getAttribute('data-id'));
        if (!removed) return;
        var ut = ++undoToken;
        ui.todoUndo = removed;
        commit();
        // Le lien « Annuler » disparaît seul ; on retire juste l'élément, sans redessiner (le clavier reste ouvert).
        setTimeout(function () {
          if (ut !== undoToken) return;
          ui.todoUndo = null;
          var u = document.querySelector('.undo');
          if (u && u.parentNode) u.parentNode.removeChild(u);
        }, 6000);
        return;
      case 'todo-undo':
        undoToken++;
        Cap.restoreTodo(state, ui.todoUndo);
        ui.todoUndo = null;
        commit();
        return;
      case 'day-todo':
        var wasDone = Cap.essentialsDone(state, k);
        Cap.toggleTodo(state, el.getAttribute('data-id'), c.now);
        commit();
        if (!wasDone && Cap.essentialsDone(state, k)) confetti();
        return;
      case 'rapport-rendu':
        Cap.setRapportRendu(state, c.today);
        state.tab = 'jour';      // l'onglet Rapport disparaît
        commit();
        window.scrollTo(0, 0);
        confetti();
        return;
      case 'rapport-undo':
        Cap.unsetRapportRendu(state);
        commit();
        return;
      case 'interview-reset':
        var hasText = state.interview.answers.some(function (a) { return a.trim(); });
        if (hasText && !window.confirm('Effacer les réponses de cette section ? Pense à les copier avant.')) return;
        copyToken++;
        state.interview = { title: '', answers: ['', '', '', '', '', '', ''] };
        ui.copyState = '';
        commit();
        return;
    }
  }

  ['click', 'input', 'change', 'submit', 'keydown', 'visibilitychange'].forEach(function (type) { document.addEventListener(type, handle); });

  // Minuteur : chaque seconde, met à jour le texte seulement ; re-rend une fois quand le temps est écoulé.
  setInterval(function () {
    var now = Date.now();
    if (Cap.tickTimer(state, now)) {
      var wasAmorce = !!state.timer.slot;
      Cap.save(state);
      startRinging();
      render();
      if (wasAmorce) confetti();
      return;
    }
    if (state.timer.status !== 'running') return;
    var txt = Cap.views.clock(Cap.timerRemaining(state, now));
    var els = document.querySelectorAll('[data-timer]');
    for (var i = 0; i < els.length; i++) els[i].textContent = txt;
  }, 1000);

  if (state.timer.status === 'running') requestWake();   // minuteur en cours à la réouverture
  try { render(); } catch (e) {
    root.textContent = 'Cap n’a pas pu démarrer : ' + (e && e.message);
  }
})();
</script>
</body>
</html>
